apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "org.jetbrains.kotlin.plugin.compose"
apply plugin: "io.sentry.android.gradle"

def enableMinifyInReleaseBuilds = (findProperty('android.enableMinifyInReleaseBuilds') ?: false).toBoolean()

android {
    ndkVersion rootProject.ext.has('ndkVersion') ? rootProject.ext.ndkVersion : '27.1.12297006'
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'com.superalarm.app'
    defaultConfig {
        applicationId 'com.superalarm.app'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 15
        versionName "1.5.0"
    }
    signingConfigs {
        release {
            def signingPropsFile = rootProject.file("super-alarm-signing.properties")
            def signingProps = new Properties()
            if (signingPropsFile.exists()) {
                signingProps.load(new FileInputStream(signingPropsFile))
            }
            def uploadStoreFile = System.getenv("SUPER_ALARM_UPLOAD_STORE_FILE")
                ?: signingProps.getProperty("SUPER_ALARM_UPLOAD_STORE_FILE")
            storeFile uploadStoreFile
                ? rootProject.file(uploadStoreFile)
                : null
            storePassword System.getenv("SUPER_ALARM_UPLOAD_STORE_PASSWORD")
                ?: signingProps.getProperty("SUPER_ALARM_UPLOAD_STORE_PASSWORD")
            keyAlias System.getenv("SUPER_ALARM_UPLOAD_KEY_ALIAS")
                ?: signingProps.getProperty("SUPER_ALARM_UPLOAD_KEY_ALIAS")
            keyPassword System.getenv("SUPER_ALARM_UPLOAD_KEY_PASSWORD")
                ?: signingProps.getProperty("SUPER_ALARM_UPLOAD_KEY_PASSWORD")
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            def enableShrinkResources = findProperty('android.enableShrinkResourcesInReleaseBuilds') ?: 'false'
            shrinkResources enableShrinkResources.toBoolean()
            minifyEnabled enableMinifyInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            def enablePngCrunchInRelease = findProperty('android.enablePngCrunchInReleaseBuilds') ?: 'true'
            crunchPngs enablePngCrunchInRelease.toBoolean()
        }
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2026.04.01')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.0'
    implementation 'androidx.navigation:navigation-compose:2.9.0'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.glance:glance-appwidget:1.1.1'
    implementation 'androidx.camera:camera-camera2:1.6.1'
    implementation 'androidx.camera:camera-lifecycle:1.6.1'
    implementation 'androidx.camera:camera-view:1.6.1'
    implementation 'com.google.guava:guava:33.6.0-android'
    implementation 'com.google.mediapipe:tasks-vision:1.0.0'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'com.posthog:posthog-android:3.60.7'
    implementation 'io.sentry:sentry-android:8.54.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    testImplementation 'junit:junit:4.13.2'
}

sentry {
    org = "q9labs"
    projectName = "super-alarm-android"
    authToken = System.getenv("SENTRY_AUTH_TOKEN")
    autoUploadProguardMapping = System.getenv("SENTRY_AUTH_TOKEN") != null
}
